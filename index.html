<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Tic Tac Toe</h1>



    <div class="board">
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
        <button class="box"></button>
    </div>

    <h2 id="winner">Your turn</h2>

    <div class="score-board">
        <p>You: <span id="user-score">0</span></p>
        <p>Comp: <span id="comp-score">0</span></p>
    </div>

    <div class="controls">
        <button class="ctrl" id="new-btn">New Game</button>
        <button class="ctrl" id="reset-btn">Reset Score</button>
    </div>

    <script src="app.js"></script>
</body>

</html>
